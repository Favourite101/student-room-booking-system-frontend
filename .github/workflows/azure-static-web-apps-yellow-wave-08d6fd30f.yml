name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Ensure this step is correctly placed and configured
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0' # Specify the exact version
          cache: 'npm' # Optional: Cache npm dependencies for faster builds

      - name: Install dependencies
        run: npm install

      - name: Debug - Check Node.js and npm versions
        run: |
          node -v
          npm -v

      - name: Build the application
        run: npm run build

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Deploy to Azure Static Web Apps
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_08D6FD30F }}
        run: |
          echo "Deploying to Azure Static Web Apps..."
          az staticwebapp deploy \
            --api-token $AZURE_STATIC_WEB_APPS_API_TOKEN \
            --app-location "/" \
            --output-location "dist"
          echo "Deployment completed!"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_WAVE_08D6FD30F }}
          action: "close"
